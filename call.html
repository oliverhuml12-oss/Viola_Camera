<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Viola</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/viola.css">
<style>
  main { max-width: 560px; margin: 0 auto; padding: 20px 20px calc(48px + env(safe-area-inset-bottom, 0px)); }
  .card { text-align: center; padding: 36px 24px; }
  .icon-disc {
    width: 108px; height: 108px; margin: 4px auto 22px; border-radius: 50%;
    background: var(--surface); display: grid; place-items: center;
    box-shadow: 0 2px 8px rgba(14, 27, 51, .08);
  }
  .icon-disc svg { width: 46px; height: 46px; fill: none; stroke: var(--blue); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .icon-disc.ok { background: var(--ok-soft); box-shadow: none; }
  .icon-disc.ok svg { stroke: var(--ok); }
  .icon-disc.bad { background: var(--bad-soft); box-shadow: none; }
  .icon-disc.bad svg { stroke: var(--bad); }
  .lead { max-width: 36ch; margin-left: auto; margin-right: auto; }
  #joinBtn { min-height: 58px; max-width: 380px; margin: 0 auto; }
  .meta { margin: 18px auto 0; font-size: 15px; color: var(--muted); }
  .hint {
    margin: 0 auto 22px; max-width: 40ch; font-size: 15px; text-align: left;
    background: var(--blue-50); border-radius: 16px; padding: 12px 16px;
  }
  .privacy { text-align: center; margin-top: 18px; }

  /* Full-screen call */
  #callScreen { position: fixed; inset: 0; background: var(--ink); z-index: 20; }
  body.in-call { overflow: hidden; }
  body.in-call header, body.in-call main { display: none; }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <span class="brand" aria-label="Viola">
      <img src="/images/logo.png" alt="Viola" width="111" height="34" onerror="this.hidden=true;this.nextElementSibling.hidden=false">
      <span class="wordmark" hidden>Viola</span>
    </span>
  </div>
</header>

<main>
  <!-- Join -->
  <section class="card" id="joinScreen">
    <div class="icon-disc" aria-hidden="true">
      <svg viewBox="0 0 48 48"><rect x="5" y="13" width="27" height="22" rx="5"/><path d="M32 21l11-6v18l-11-6z"/></svg>
    </div>
    <h1 data-t="call.title"></h1>
    <p class="lead" data-t="call.lead"></p>
    <button class="btn block" id="joinBtn" type="button" disabled data-t="call.checking"></button>
    <p class="meta" id="closesAt" hidden></p>
  </section>

  <!-- Messages: ended / not active / camera / error -->
  <section class="card" id="messageScreen" hidden aria-live="polite">
    <div class="icon-disc" id="msgIcon" aria-hidden="true">
      <svg viewBox="0 0 48 48" id="msgSvg"></svg>
    </div>
    <h2 id="msgTitle"></h2>
    <p class="lead" id="msgText"></p>
    <p class="hint" id="msgHint" hidden></p>
    <button class="btn block" id="retryBtn" type="button" hidden data-t="call.retry" style="max-width:380px;margin:0 auto"></button>
  </section>

  <p class="small privacy" data-t="call.privacy"></p>
</main>

<!-- The Daily call goes here, full screen -->
<div id="callScreen" hidden></div>

<script src="https://unpkg.com/@daily-co/daily-js@0.89.1/dist/daily.js"></script>
<script src="/assets/i18n.js"></script>
<script src="/assets/call.js"></script>
</body>
</html>
