<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Viola – Kontrola kamery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ===== Brand tokens – replace with exact Viola colours ===== */
  :root {
    --violet: #5B2A86;        /* primary brand */
    --violet-deep: #3E1C5E;   /* hover / headings */
    --lilac: #F4EEFA;         /* page background */
    --lilac-line: #E2D6EF;    /* borders */
    --surface: #FFFFFF;
    --text: #2A2233;
    --muted: #6B6275;
    --ok: #2F8F5B;
    --ok-soft: #E3F4EA;
    --bad: #C2364E;
    --bad-soft: #FBE7EA;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --violet: #B48BE0; --violet-deep: #D7C0F0; --lilac: #1C1622; --lilac-line: #3A2F45;
      --surface: #261E2E; --text: #F1ECF6; --muted: #B3A8BF;
      --ok: #5CC88D; --ok-soft: #1F3A2B; --bad: #F07A8E; --bad-soft: #43222A;
      color-scheme: dark;
    }
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--lilac);
    color: var(--text);
    font-family: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 17px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  header {
    display: flex; justify-content: space-between; align-items: center;
    max-width: 560px; margin: 0 auto; padding: 20px 20px 0;
  }
  .brand { display: flex; align-items: center; gap: 8px; color: var(--violet); font-weight: 700; font-size: 26px; letter-spacing: -0.02em; text-decoration: none; }
  .brand svg { width: 28px; height: 28px; }
  .lang { display: flex; gap: 4px; }
  .lang button {
    font: inherit; font-size: 14px; font-weight: 600; color: var(--muted);
    background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 4px 8px; cursor: pointer;
  }
  .lang button[aria-pressed="true"] { color: var(--violet); border-color: var(--lilac-line); background: var(--surface); }

  main { max-width: 560px; margin: 0 auto; padding: 24px 20px 40px; }
  .progress { font-size: 14px; color: var(--muted); margin: 0 0 8px; }
  .bar { height: 6px; background: var(--lilac-line); border-radius: 99px; overflow: hidden; margin-bottom: 24px; }
  .bar span { display: block; height: 100%; width: 60%; background: var(--violet); border-radius: 99px; }

  .card {
    background: var(--surface); border: 1px solid var(--lilac-line);
    border-radius: 24px; padding: 32px 24px; text-align: center;
  }
  h1 { font-size: 28px; line-height: 1.2; margin: 0 0 8px; color: var(--violet-deep); letter-spacing: -0.01em; }
  .lead { color: var(--muted); margin: 0 auto 24px; max-width: 40ch; }

  /* ===== Status circle – the one memorable element ===== */
  .status { position: relative; width: 132px; height: 132px; margin: 8px auto 24px; }
  .status .disc {
    position: absolute; inset: 12px; border-radius: 50%;
    background: var(--lilac); display: grid; place-items: center;
    transition: background .3s ease;
  }
  .status .ring { position: absolute; inset: 0; transform: rotate(-90deg); }
  .status .ring circle { fill: none; stroke-width: 6; }
  .ring .track { stroke: var(--lilac-line); }
  .ring .arc { stroke: var(--violet); stroke-linecap: round; stroke-dasharray: 380; stroke-dashoffset: 380; transition: stroke .3s ease, stroke-dashoffset .5s ease; }
  .icon { width: 52px; height: 52px; stroke: var(--violet); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; display: none; }
  [data-state="idle"] .i-cam, [data-state="checking"] .i-cam { display: block; }
  [data-state="success"] .i-ok { display: block; stroke: var(--ok); }
  [data-state="fail"] .i-bad { display: block; stroke: var(--bad); }
  .i-ok path, .i-bad path { stroke-dasharray: 60; stroke-dashoffset: 60; }
  [data-state="success"] .i-ok path, [data-state="fail"] .i-bad path { animation: draw .45s ease forwards .15s; }
  [data-state="checking"] .ring { animation: spin 1.1s linear infinite; }
  [data-state="checking"] .arc { stroke-dashoffset: 270; }
  [data-state="success"] .arc { stroke: var(--ok); stroke-dashoffset: 0; }
  [data-state="success"] .disc { background: var(--ok-soft); }
  [data-state="fail"] .arc { stroke: var(--bad); stroke-dashoffset: 0; }
  [data-state="fail"] .disc { background: var(--bad-soft); }
  @keyframes spin { to { transform: rotate(270deg); } }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  ol.steps { text-align: left; margin: 0 auto 28px; padding: 0; list-style: none; max-width: 360px; counter-reset: s; }
  ol.steps li { counter-increment: s; display: flex; gap: 12px; align-items: flex-start; padding: 8px 0; }
  ol.steps li::before {
    content: counter(s); flex: 0 0 28px; height: 28px; border-radius: 50%;
    background: var(--lilac); color: var(--violet); font-weight: 700; font-size: 14px;
    display: grid; place-items: center; margin-top: 1px;
  }

  .msg { margin: 0 auto 24px; max-width: 40ch; }
  .msg h2 { font-size: 22px; margin: 0 0 6px; }
  .msg p { margin: 0; color: var(--muted); }
  .msg .hint { margin-top: 12px; font-size: 15px; background: var(--lilac); border-radius: 12px; padding: 10px 14px; color: var(--text); text-align: left; }
  [data-state="success"] .msg h2 { color: var(--ok); }
  [data-state="fail"] .msg h2 { color: var(--bad); }

  .btn {
    font: inherit; font-weight: 600; font-size: 18px;
    display: block; width: 100%; max-width: 360px; margin: 0 auto;
    padding: 16px 24px; border-radius: 999px; border: 2px solid var(--violet);
    background: var(--violet); color: var(--surface); cursor: pointer;
    transition: background .2s ease, border-color .2s ease;
  }
  .btn:hover { background: var(--violet-deep); border-color: var(--violet-deep); }
  .btn:disabled { opacity: .5; cursor: progress; }
  .btn:focus-visible, .lang button:focus-visible { outline: 3px solid var(--violet); outline-offset: 3px; }
  .btn.secondary { background: transparent; color: var(--violet); }

  .privacy { font-size: 14px; color: var(--muted); text-align: center; margin: 20px auto 0; max-width: 44ch; }
  .mock-note { margin-top: 16px; font-size: 14px; color: var(--muted); }

  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<header>
  <a class="brand" href="#" aria-label="Viola">
    <svg viewBox="0 0 28 28" aria-hidden="true">
      <g fill="currentColor">
        <circle cx="14" cy="7.5" r="5"/><circle cx="7.8" cy="12" r="5" opacity=".75"/>
        <circle cx="20.2" cy="12" r="5" opacity=".75"/><circle cx="10" cy="19.5" r="5" opacity=".55"/>
        <circle cx="18" cy="19.5" r="5" opacity=".55"/>
      </g>
      <circle cx="14" cy="14" r="2.6" fill="#F4C542"/>
    </svg>
    viola
  </a>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="cs">CZ</button>
    <button type="button" data-lang="sk">SK</button>
    <button type="button" data-lang="en">EN</button>
  </div>
</header>

<main>
  <p class="progress" data-t="progress"></p>
  <div class="bar" aria-hidden="true"><span></span></div>

  <section class="card" id="card" data-state="idle" aria-live="polite">
    <h1 data-t="title"></h1>
    <p class="lead" data-t="lead"></p>

    <div class="status" aria-hidden="true">
      <svg class="ring" viewBox="0 0 132 132">
        <circle class="track" cx="66" cy="66" r="60"/>
        <circle class="arc" cx="66" cy="66" r="60"/>
      </svg>
      <div class="disc">
        <svg class="icon i-cam" viewBox="0 0 48 48"><rect x="5" y="13" width="27" height="22" rx="5"/><path d="M32 21l11-6v18l-11-6z"/></svg>
        <svg class="icon i-ok" viewBox="0 0 48 48"><path d="M11 25l9 9 17-19"/></svg>
        <svg class="icon i-bad" viewBox="0 0 48 48"><path d="M14 14l20 20M34 14L14 34"/></svg>
      </div>
    </div>

    <!-- idle -->
    <div id="idleBlock">
      <ol class="steps">
        <li data-t="step1"></li>
        <li data-t="step2"></li>
        <li data-t="step3"></li>
      </ol>
      <button class="btn" id="checkBtn" type="button" data-t="check"></button>
    </div>

    <!-- checking -->
    <div id="checkingBlock" class="msg" hidden>
      <p data-t="waiting"></p>
    </div>

    <!-- success -->
    <div id="successBlock" hidden>
      <div class="msg">
        <h2 data-t="okTitle"></h2>
        <p data-t="okText"></p>
      </div>
      <button class="btn" id="continueBtn" type="button" data-t="continue"></button>
      <p class="mock-note" id="mockNote" data-t="mockNote" hidden></p>
    </div>

    <!-- fail -->
    <div id="failBlock" hidden>
      <div class="msg">
        <h2 data-t="failTitle"></h2>
        <p id="failReason"></p>
        <p class="hint" id="failHint" hidden></p>
      </div>
      <button class="btn" id="retryBtn" type="button" data-t="retry"></button>
    </div>
  </section>

  <p class="privacy" data-t="privacy"></p>
</main>

<script>
const T = {
  cs: {
    progress: "Krok 3 z 5",
    title: "Kontrola kamery",
    lead: "Během videohovoru vás potřebujeme vidět. Ověřte, že vám na tomto zařízení funguje kamera.",
    step1: "Klepněte na tlačítko níže.",
    step2: "Prohlížeč se zeptá na přístup ke kameře a mikrofonu. Zvolte „Povolit“.",
    step3: "Počkejte na zelenou fajfku.",
    check: "Zkontrolovat kameru",
    waiting: "Čekáme na vaše povolení… V okně, které se objevilo, zvolte „Povolit“.",
    okTitle: "Kamera funguje",
    okText: "Můžete pokračovat v testu. Kamera je znovu vypnutá.",
    continue: "Pokračovat",
    mockNote: "Ukázka: zde by test pokračoval další otázkou.",
    failTitle: "Kontrola kamery se nezdařila",
    retry: "Zkusit znovu",
    denied: "Přístup ke kameře byl zablokován. Povolte kameru pro tuto stránku v nastavení prohlížeče a zkuste to znovu.",
    hintIos: "Na iPhonu: klepněte na „aA“ v adresním řádku → Nastavení webu → Kamera → Povolit.",
    hintOther: "V Chromu: klepněte na ikonu vlevo od adresy → Oprávnění → Kamera → Povolit.",
    notfound: "Na tomto zařízení jsme nenašli kameru. Použijte telefon nebo počítač s přední kamerou.",
    busy: "Kameru právě používá jiná aplikace. Zavřete aplikace jako WhatsApp nebo jiné videohovory a zkuste to znovu.",
    unsupported: "Tento prohlížeč nemůže použít kameru. Otevřete stránku v Safari nebo Chrome.",
    generic: "Něco se pokazilo. Zkuste to prosím znovu.",
    privacy: "Kameru používáme jen pro tuto kontrolu. Nic nenahráváme ani neukládáme."
  },
  sk: {
    progress: "Krok 3 z 5",
    title: "Kontrola kamery",
    lead: "Počas videohovoru vás potrebujeme vidieť. Overte, či vám na tomto zariadení funguje kamera.",
    step1: "Ťuknite na tlačidlo nižšie.",
    step2: "Prehliadač sa opýta na prístup ku kamere a mikrofónu. Zvoľte „Povoliť“.",
    step3: "Počkajte na zelenú fajku.",
    check: "Skontrolovať kameru",
    waiting: "Čakáme na vaše povolenie… V okne, ktoré sa zobrazilo, zvoľte „Povoliť“.",
    okTitle: "Kamera funguje",
    okText: "Môžete pokračovať v teste. Kamera je opäť vypnutá.",
    continue: "Pokračovať",
    mockNote: "Ukážka: tu by test pokračoval ďalšou otázkou.",
    failTitle: "Kontrola kamery sa nepodarila",
    retry: "Skúsiť znova",
    denied: "Prístup ku kamere bol zablokovaný. Povoľte kameru pre túto stránku v nastaveniach prehliadača a skúste to znova.",
    hintIos: "Na iPhone: ťuknite na „aA“ v paneli s adresou → Nastavenia webu → Kamera → Povoliť.",
    hintOther: "V Chrome: ťuknite na ikonu vľavo od adresy → Povolenia → Kamera → Povoliť.",
    notfound: "Na tomto zariadení sme nenašli kameru. Použite telefón alebo počítač s prednou kamerou.",
    busy: "Kameru práve používa iná aplikácia. Zatvorte aplikácie ako WhatsApp alebo iné videohovory a skúste to znova.",
    unsupported: "Tento prehliadač nemôže použiť kameru. Otvorte stránku v Safari alebo Chrome.",
    generic: "Niečo sa pokazilo. Skúste to, prosím, znova.",
    privacy: "Kameru používame len na túto kontrolu. Nič nenahrávame ani neukladáme."
  },
  en: {
    progress: "Step 3 of 5",
    title: "Camera check",
    lead: "During the video call we need to see you. Let’s check that your camera works on this device.",
    step1: "Tap the button below.",
    step2: "Your browser will ask for camera and microphone access. Choose “Allow”.",
    step3: "Wait for the green check mark.",
    check: "Check my camera",
    waiting: "Waiting for your permission… Choose “Allow” in the window that appeared.",
    okTitle: "Your camera works",
    okText: "You can continue with the test. The camera has been switched off again.",
    continue: "Continue",
    mockNote: "Mock: the test would continue with the next question here.",
    failTitle: "Camera check failed",
    retry: "Try again",
    denied: "Camera access was blocked. Allow the camera for this page in your browser settings, then try again.",
    hintIos: "On iPhone: tap “aA” in the address bar → Website Settings → Camera → Allow.",
    hintOther: "In Chrome: tap the icon left of the address → Permissions → Camera → Allow.",
    notfound: "No camera was found on this device. Use a phone or computer with a front camera.",
    busy: "Another app is using your camera. Close apps like WhatsApp or other video calls, then try again.",
    unsupported: "This browser can’t use the camera. Open this page in Safari or Chrome.",
    generic: "Something went wrong. Please try again.",
    privacy: "We only use the camera for this check. Nothing is recorded or stored."
  }
};

const card = document.getElementById("card");
const blocks = {
  idle: document.getElementById("idleBlock"),
  checking: document.getElementById("checkingBlock"),
  success: document.getElementById("successBlock"),
  fail: document.getElementById("failBlock")
};
const failReason = document.getElementById("failReason");
const failHint = document.getElementById("failHint");
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

let lang = (navigator.language || "cs").slice(0, 2);
if (!T[lang]) lang = "cs";
let lastError = null;

function applyLang(l) {
  lang = l;
  document.documentElement.lang = l;
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = T[l][el.dataset.t]; });
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === l));
  document.title = "Viola – " + T[l].title;
  if (lastError) showFailText(lastError);
}

function setState(s) {
  card.dataset.state = s;
  Object.entries(blocks).forEach(([k, el]) => el.hidden = k !== s);
}

function showFailText(code) {
  failReason.textContent = T[lang][code];
  if (code === "denied") {
    failHint.textContent = isIOS ? T[lang].hintIos : T[lang].hintOther;
    failHint.hidden = false;
  } else {
    failHint.hidden = true;
  }
}

function fail(code) {
  lastError = code;
  showFailText(code);
  setState("fail");
  document.getElementById("retryBtn").focus();
}

async function runCheck() {
  lastError = null;
  if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    return fail("unsupported");
  }
  setState("checking");
  let stream;
  try {
    // camera + mic together → a single browser prompt
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true });
  } catch (e) {
    const map = {
      NotAllowedError: "denied", SecurityError: "denied", PermissionDeniedError: "denied",
      NotFoundError: "notfound", OverconstrainedError: "notfound", DevicesNotFoundError: "notfound",
      NotReadableError: "busy", TrackStartError: "busy", AbortError: "busy"
    };
    return fail(map[e.name] || "generic");
  }
  const video = stream.getVideoTracks()[0];
  const ok = video && video.readyState === "live";
  stream.getTracks().forEach(t => t.stop());   // switch the camera off again
  if (!ok) return fail("notfound");
  setState("success");
  document.getElementById("continueBtn").focus();
}

document.getElementById("checkBtn").addEventListener("click", runCheck);
document.getElementById("retryBtn").addEventListener("click", runCheck);
document.getElementById("continueBtn").addEventListener("click", () => {
  document.getElementById("mockNote").hidden = false;
});
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => applyLang(b.dataset.lang)));

applyLang(lang);
setState("idle");
</script>
</body>
</html>
